<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Upstream Healer{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800">
  <div class="min-h-full">
    <!-- Nav -->
    <nav class="bg-white border-b border-slate-200">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-14">
          <div class="flex items-center gap-8">
            <a href="/" class="flex items-center gap-2 font-semibold text-brand-700">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
              </svg>
              Upstream Healer
            </a>
            <div class="hidden sm:flex gap-4 text-sm">
              <a href="/" class="text-slate-600 hover:text-brand-600">Dashboard</a>
              <a href="/hosts/add" class="text-slate-600 hover:text-brand-600">Add Host</a>
              <a href="/notifications" class="text-slate-600 hover:text-brand-600">Notifications</a>
              <a href="/settings" class="text-slate-600 hover:text-brand-600">Settings</a>
            </div>
          </div>
          <div class="flex items-center text-xs text-slate-400">
            v1 · Raspberry Pi
          </div>
        </div>
      </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
