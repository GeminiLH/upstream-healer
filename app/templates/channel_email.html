{% extends "base.html" %}
{% block title %}Add Email · Upstream Healer{% endblock %}

{% block content %}
<div class="max-w-xl">
  <h1 class="text-2xl font-bold text-slate-900 mb-2">Add Email Channel</h1>
  <p class="text-slate-500 text-sm mb-6">
    Configure SMTP for Dynu (or Gmail later). You can list multiple recipients.
  </p>

  <form method="post" class="bg-white rounded-xl border border-slate-200 p-6 space-y-5 shadow-sm">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Display name</label>
      <input type="text" name="name" value="Email"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
    </div>

    <div class="grid grid-cols-3 gap-3">
      <div class="col-span-2">
        <label class="block text-sm font-medium text-slate-700 mb-1">SMTP Host *</label>
        <input type="text" name="smtp_host" required
               value="smtp.dynu.com"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Port</label>
        <input type="number" name="smtp_port" value="587"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Username *</label>
      <input type="text" name="username" required
             placeholder="your@dynu-email.com"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Password *</label>
      <input type="password" name="password" required
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">From address</label>
      <input type="text" name="from_addr"
             placeholder="Leave blank to use username"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">To addresses * (comma-separated)</label>
      <input type="text" name="to_addrs" required
             placeholder="person1@email.com, person2@email.com"
             class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none">
      <p class="text-xs text-slate-400 mt-1">2 or 3 addresses are fine</p>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit" class="px-5 py-2.5 bg-emerald-600 text-white text-sm font-medium rounded-lg hover:bg-emerald-700">
        Save Email Channel
      </button>
      <a href="/notifications" class="px-5 py-2.5 border border-slate-300 text-sm rounded-lg hover:bg-slate-50">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
