# GitLab CI/CD — Upstream Healer
#
# Stages:  test  ->  build  ->  deploy
#   * lint + unit tests run on every push / MR
#   * the image is built on the default branch and pushed to the GitLab
#     registry when it is reachable (plain HTTP here, no TLS); if the
#     registry is down the build is kept and the push is skipped with a warning
#   * three MANUAL deploy jobs — test / dev / production. Press Play on the
#     one you want; each deploys that exact commit. test/production SSH to
#     their boxes; dev deploys the FULL local stack (healer + Nginx Proxy
#     Manager pair + dev data seeder) onto the gitlab/runner box itself and
#     leaves it running — plus a manual dev_down job tears it back down
#
# Environments:  test, dev, production   (Settings -> CI/CD -> Environments)
#
# CI/CD variables (Settings -> CI/CD -> Variables) — create each one per
# environment (scope: test or production). deploy_dev needs none: the dev
# NPM pair uses sandbox defaults from docker-compose.dev.yml (override with
# the DEV_WEB_*_PORT / NPM_DEV_* job variables if the box differs), and
# optionally TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_IDS to have the seeder
# create a telegram channel:
#   SSH_PRIVATE_KEY     [File]  private key of the deploy SSH key
#   DEPLOY_KNOWN_HOSTS  [File]  output of: ssh-keyscan <target-host>
#   DEPLOY_USER                     your account on that target
#   DEPLOY_HOST                     that target's address
#   DEPLOY_PATH                     repo checkout path on that target
#
# No database variables are needed by the pipeline: the unit tests are fully
# hermetic (mocked Docker client, throwaway SQLite). On a deploy target the
# app discovers the NPM MySQL itself via docker exec into the sibling
# container, so NPM_DB_* is never consulted there.

stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.pip
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

# ───────────────────────────── Test ─────────────────────────────

lint:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir "ruff>=0.4"
  script:
    - ruff check app/ scripts/ tests/
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

unit_tests:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
  script:
    - pytest tests/ -v --tb=short --junitxml=test-results.xml
  artifacts:
    when: always
    paths:
      - test-results.xml
    reports:
      junit: test-results.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ───────────────────────────── Build ─────────────────────────────

build_image:
  stage: build
  image: docker:latest
  # docker:dind needs a PRIVILEGED runner. Job-level `privileged:` is rejected
  # by this GitLab (19.x) and fails the whole pipeline, so set it on the runner
  # instead:  privileged = true   in the gitlab-runner config.toml
  # (if the runner itself is a container, also set `privileged: true` in its
  # compose service and restart it). Until that is done, the job below detects
  # the dead daemon and skips gracefully, keeping the pipeline green — deploys
  # are unaffected because they build from source on the target box.
  services:
    - name: docker:dind
      # (the runner auto-aliases it as `docker`, which DOCKER_HOST below uses)
      # the gitlab registry is plain HTTP in this deployment; let dind trust it
      command: ["--insecure-registry", "192.168.86.38:5000"]
  variables:
    # the runner auto-generates dind TLS certs in /certs; use them
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    DOCKER_HOST: tcp://docker:2376
  before_script:
    - export IMAGE_PUSH=0
    - |
      if ! docker info >/dev/null 2>&1; then
        echo "WARNING: no docker daemon in this sandbox — dind did not start."
        echo "If your runner itself runs in a container, start it with"
        echo "privileged: true (compose) / privileged = true (config.toml)."
        echo "Skipping the image build; deploys are unaffected (they build"
        echo "from source on the target box)."
        exit 0
      fi
    - |
      if [ -n "$CI_REGISTRY" ] && docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"; then
        IMAGE_PUSH=1
      elif [ -z "$CI_REGISTRY" ]; then
        echo "Note: CI_REGISTRY is not configured on this GitLab — building locally only."
      fi
  script:
    - |
      if [ -n "$CI_REGISTRY_IMAGE" ]; then IMG="$CI_REGISTRY_IMAGE"; else IMG="upstream-healer"; fi
      docker build -t "$IMG:$CI_COMMIT_SHORT_SHA" -t "$IMG:latest" .
      if [ "$IMAGE_PUSH" = "1" ]; then
        docker push "$IMG:$CI_COMMIT_SHORT_SHA"
        docker push "$IMG:latest"
      else
        echo "Skipping push — registry not configured or unreachable. Image stays local."
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ───────────────────────────── Deploy (manual) ─────────────────────────────
#
# Nothing deploys automatically. When a build of the default branch finishes,
# these three jobs appear as "manual" — press Play on the one you want;
# each deploys that exact commit.
#
# Two mechanisms, by environment:
#   deploy_test / deploy_production — SSH to a remote box (.deploy_base).
#     Need environment-scoped variables (scope: that environment); until they
#     exist the job fails fast with a clear message.
#   deploy_dev — runs ON the gitlab/runner box. The existing runner mounts
#     /var/run/docker.sock into every job ([runners.docker] volumes in
#     config.toml), so the job compose-ups the stack with the HOST daemon;
#     the containers keep running after the job ends. Needs no variables
#     and no extra setup; if that socket mount is ever removed from the
#     runner, the job skips gracefully instead of breaking the pipeline.
#     (Job-level `volumes:` in .gitlab-ci.yml is NOT an option: this GitLab
#     fails the whole pipeline on that keyword — the runner-level mount is
#     the sanctioned home for it. Note the socket gives the job full
#     control of the host daemon — same trust level as the runner itself.)

.deploy_base:
  stage: deploy
  image: alpine:3.20
  variables:
    GIT_STRATEGY: none
  needs:
    - unit_tests
    - build_image
  script:
    - apk add --no-cache openssh-client git
    - |
      if [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_PATH" ] \
         || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
        echo "ERROR: cannot deploy — missing CI/CD variables for this environment."
        echo "Create environment-scoped variables in Settings -> CI/CD -> Variables"
        echo "(set the variable's Environment scope to this job's environment)."
        echo "  DEPLOY_USER, DEPLOY_HOST, DEPLOY_PATH,"
        echo "  SSH_PRIVATE_KEY (File), DEPLOY_KNOWN_HOSTS (File)"
        exit 1
      fi
    - eval $(ssh-agent -s)
    # [File] variables expose a PATH to the decrypted file; plain variables
    # expose the content itself — handle both
    - |
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        tr -d '\r' < "$SSH_PRIVATE_KEY" | ssh-add -
      else
        printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
      fi
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -f "$DEPLOY_KNOWN_HOSTS" ]; then
        tr -d '\r' < "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
      fi
    - chmod 644 ~/.ssh/known_hosts
    - ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST"
        "set -euo pipefail; cd '$DEPLOY_PATH'; git fetch origin; git checkout '$CI_COMMIT_SHA'; docker compose up -d --build"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

deploy_test:
  extends: .deploy_base
  environment:
    name: test

deploy_dev:
  # Live dev/staging stack on the gitlab/runner box, left running between
  # deploys. The runner already mounts /var/run/docker.sock into jobs and
  # runs them with host networking, so this job talks to the HOST docker
  # daemon (DOCKER_HOST below); `docker:latest` ships compose v2.
  #
  # docker-compose.dev.yml brings up the complete stack the healer needs
  # to actually work: the app itself, the Nginx Proxy Manager pair it
  # talks to (nginx-app-1 / nginx-db-1) and a one-shot dev data seeder
  # (hosts + proxy_host rows + optional telegram channel). Host-networked
  # containers publish no ports (empty PORTS column in docker ps) — they
  # bind host ports directly: 8787 UI, 8181/8182 NPM, 3306 dev MariaDB.
  stage: deploy
  image: docker:latest
  environment:
    name: dev
  needs:
    - unit_tests
    - build_image
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    # Sandbox credentials for the dev NPM pair (compose reads these for
    # its ${...:-default} interpolations — plain values, dev box only).
    NPM_DEV_DB_USER: proxymanager
    NPM_DEV_DB_PASSWORD: devhealer123
    NPM_DEV_ROOT_PASSWORD: devhealer123root
    NPM_DEV_WEB_PASSWORD: devhealer123
  before_script:
    - |
      if ! docker info >/dev/null 2>&1; then
        echo "WARNING: cannot reach the host docker daemon from this job."
        echo "The runner must mount /var/run/docker.sock into jobs"
        echo "([runners.docker] volumes in config.toml)."
        echo "Skipping the dev deploy."
        exit 0
      fi
      echo "dev stack will live on: $(docker info --format '{{.Name}}')"
  script:
    - cd "$CI_PROJECT_DIR"
    - |
      # Reclaim container names/ports from the previous stack FIRST: a
      # still-running dev stack (left up by the last deploy) or the old
      # single-service `upstream-healer` container holds 8787/8181/8182/3306,
      # so preflight below would otherwise refuse to run while our own
      # previous deploy is up. Best-effort: compose fails loudly if a
      # name is genuinely still held by something we don't own.
      docker rm -f upstream-healer nginx-app-1 nginx-db-1 2>/dev/null || true
      echo "==> previous dev/prod containers cleared"
    - |
      # Preflight now sees the box as it will be during `up`: any port
      # still occupied belongs to a foreign service, not to us.
      echo "==> Preflight: host ports the dev stack needs"
      ports="$(docker run --rm --network host alpine:3.20 sh -c '
        for p in 8787 8181 8182 3306; do
          if nc -z -w 1 127.0.0.1 "$p" 2>/dev/null; then echo "$p used"; else echo "$p free"; fi
        done')"
      echo "$ports"
      if echo "$ports" | grep -q '^3306 used'; then
        echo "ERROR: port 3306 is taken on the gitlab box (dev MariaDB needs it)."
        echo "Stop whatever holds it, then re-run this job."
        exit 1
      fi
      if echo "$ports" | grep -q '^8787 used'; then
        echo "ERROR: port 8787 is still held after reclaiming our containers."
        exit 1
      fi
      # Give the dev NPM web/edge the first free candidate pair; compose
      # picks them up via ${DEV_WEB_*_PORT} in docker-compose.dev.yml.
      pick_port() {
        for candidate in "$@"; do
          if ! docker run --rm --network host alpine:3.20 nc -z -w 1 127.0.0.1 "$candidate" >/dev/null 2>&1; then
            echo "$candidate"
            return 0
          fi
        done
        return 1
      }
      export DEV_WEB_HTTP_PORT=$(pick_port 8181 8191 8281) || {
        echo "ERROR: no free port for the NPM web UI (tried 8181 8191 8281)"
        exit 1
      }
      export DEV_WEB_HTTPS_PORT=$(pick_port 8182 8192 8282) || {
        echo "ERROR: no free edge port for NPM (tried 8182 8192 8282)"
        exit 1
      }
      export DEV_EDGE_PORT="$DEV_WEB_HTTPS_PORT"
      if [ "$DEV_WEB_HTTP_PORT" = "$DEV_WEB_HTTPS_PORT" ]; then
        echo "ERROR: web and edge landed on the same port ($DEV_WEB_HTTP_PORT)"
        exit 1
      fi
      echo "NPM web UI on :$DEV_WEB_HTTP_PORT, edge on :$DEV_WEB_HTTPS_PORT"
    - docker compose -f docker-compose.dev.yml up -d --build
    - docker compose -f docker-compose.dev.yml ps
    - |
      # The one-shot seeder runs after the other three containers start;
      # wait for it to finish (it exits 0 for soft issues, non-zero if it
      # truly broke) and always show its output.
      for i in $(seq 1 60); do
        state=$(docker inspect -f '{{.State.Status}}' upstream-healer-seed-1 2>/dev/null || echo missing)
        if [ "$state" = "exited" ]; then
          break
        fi
        if [ "$state" = "missing" ]; then
          echo "ERROR: seeder container never started"
          docker compose -f docker-compose.dev.yml ps
          exit 1
        fi
        sleep 5
      done
      docker logs upstream-healer-seed-1 || true
      code=$(docker inspect -f '{{.State.ExitCode}}' upstream-healer-seed-1 2>/dev/null || echo 1)
      if [ "$code" != "0" ]; then
        echo "ERROR: seeder exited with code $code (see logs above)"
        exit 1
      fi
    - |
      ok=""
      for i in 1 2 3 4 5 6; do
        if docker exec upstream-healer curl -sf -o /dev/null http://127.0.0.1:8787/; then
          ok=1; break
        fi
        sleep 3
      done
      if [ -z "$ok" ]; then
        echo "ERROR: dev app is not answering on :8787 — check: docker logs upstream-healer"
        exit 1
      fi
      if ! docker exec upstream-healer curl -sf -o /dev/null "http://127.0.0.1:$DEV_WEB_HTTP_PORT/"; then
        echo "WARNING: NPM UI not answering on :$DEV_WEB_HTTP_PORT yet — check: docker logs nginx-app-1"
      fi
    - docker exec upstream-healer python -m app.cli list-hosts
    - docker exec upstream-healer python -m app.cli list-telegram
    - |
      docker exec -e MYSQL_HOST=127.0.0.1 nginx-db-1 mysql -h127.0.0.1 \
        -u"$NPM_DEV_DB_USER" -p"$NPM_DEV_DB_PASSWORD" proxy_manager \
        -e "SELECT id, domain_names, forward_host, forward_port FROM proxy_host WHERE is_deleted = 0" \
        || echo "(NPM MariaDB not queryable yet — the seeder reported above)"
    - |
      echo "=============================================================="
      echo " dev stack is up (commit $CI_COMMIT_SHORT_SHA)"
      echo "   Healer UI : http://<gitlab-box>:8787"
      echo "   NPM UI    : http://<gitlab-box>:$DEV_WEB_HTTP_PORT"
      echo "               login dev@hylla.local / $NPM_DEV_WEB_PASSWORD"
      echo "   Seeded    : vault, jellyfin, failtest + proxy_host rows"
      echo "   Teardown  : press Play on dev_down"
      echo "=============================================================="
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

dev_down:
  # Tears the dev stack back down. Named volumes are KEPT so the next
  # deploy_dev finds the previous hosts/notifications/NPM config; to wipe
  # them instead: docker volume rm upstream-healer_healer-data etc.
  stage: deploy
  image: docker:latest
  environment:
    name: dev
  needs:
    - unit_tests
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    - |
      if ! docker info >/dev/null 2>&1; then
        echo "WARNING: cannot reach the host docker daemon from this job. Skipping teardown."
        exit 0
      fi
  script:
    - cd "$CI_PROJECT_DIR"
    - docker compose -f docker-compose.dev.yml down --remove-orphans
    - |
      echo "Dev containers removed; volumes kept:"
      docker volume ls | grep -E 'healer-data|npm-data|npm-certs|npm-mysql' || echo "(no dev volumes left)"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

deploy_production:
  extends: .deploy_base
  environment:
    name: production
dev_debug:
  # Manual diagnostic for the dev stack: container states (restart counts,
  # OOM flags, exit codes) plus a tail of each container log. Use when the
  # stack misbehaves but the deploy job itself passed.
  stage: deploy
  image: docker:latest
  environment:
    name: dev
  needs:
    - unit_tests
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    - |
      if ! docker info >/dev/null 2>&1; then
        echo "WARNING: cannot reach the host docker daemon from this job. Skipping debug."
        exit 0
      fi
  script:
    - |
      echo "==> container states"
      docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' | head -25
      echo
      echo "==> restart / OOM / exit detail"
      for c in upstream-healer nginx-app-1 nginx-db-1; do
        docker inspect --format '{{.Name}} restarts={{.RestartCount}} oomkilled={{.State.OOMKilled}} exitcode={{.State.ExitCode}}' "$c" 2>/dev/null || echo "$c not found"
      done
    - |
      for c in nginx-db-1 nginx-app-1 upstream-healer; do
        echo
        echo "===== logs: $c (tail 80) ====="
        docker logs --tail 80 "$c" 2>&1 | tail -80
      done
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
