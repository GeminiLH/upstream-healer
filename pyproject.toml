[tool.ruff]
# Allow unused imports for now since we have shared dependencies
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # mccabe
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "PYI", # flake8-pyi
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "EXE", # flake8-executable
    "NPY", # numpy-specific rules
    "PD",  # pandas-vet
]

# Ignore specific rules that are causing false positives in our case
extend-ignore = [
    "F821",  # Allow undefined names (specifically for template request issue)
]

[tool.ruff.lint.per-file-ignores]
"app/routers/dashboard.py" = ["F821"]